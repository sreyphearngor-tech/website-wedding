<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ចំណងដៃ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Moul&family=Moulpali&family=Kantumruy+Pro:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Pinyon+Script&display=swap">

</head>
<body>

<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d5d1c"/><stop offset=".3" stop-color="#e3c673"/><stop offset=".45" stop-color="#fff2bd"/><stop offset=".7" stop-color="#b8903a"/><stop offset="1" stop-color="#8a6a22"/></linearGradient>
    <filter id="sl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/><feSpecularLighting in="b" surfaceScale="5" specularConstant=".9" specularExponent="24" lighting-color="#fff1bd" result="s"><fePointLight x="22" y="8" z="70"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/><feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/></filter>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" result="t"/><feColorMatrix in="t" values="0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .6 0" result="c"/><feComposite in="c" in2="SourceAlpha" operator="in"/></filter>
    <symbol id="crest" viewBox="0 0 40 30"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M4 27H36"/><path d="M20 27C20 17 20 10 20 5M20 27C15 19 11 13 6 10M20 27C12 22 8 20 3 19M20 27C25 19 29 13 34 10M20 27C28 22 32 20 37 19"/><path d="M8 27C8 21 11 17 15 15M32 27C32 21 29 17 25 15"/></g><circle cx="20" cy="4" r="1.6" fill="currentColor"/></symbol>
    <symbol id="corner" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5 5H70M5 5V70"/><path d="M5 22C34 22 52 40 52 64C52 82 36 86 32 74C29 64 40 58 46 66"/><path d="M22 5C22 34 40 52 64 52C82 52 86 36 74 32C64 29 58 40 66 46"/><path d="M14 14C28 18 38 28 42 42"/></g><g fill="currentColor"><path d="M70 5C80 9 84 17 80 24C72 21 68 13 70 5Z"/><path d="M5 70C9 80 17 84 24 80C21 72 13 68 5 70Z"/><circle cx="5" cy="5" r="2.4"/></g></symbol>
    <symbol id="heart" viewBox="0 0 20 20"><path d="M10 17C2 11 2 5 6 4C8 4 9.5 5 10 7C10.5 5 12 4 14 4C18 5 18 11 10 17Z" fill="url(#gf)"/></symbol>
    <symbol id="bfly" viewBox="0 0 30 24"><g fill="url(#gf)"><path d="M15 12C10 2 2 0 2 6C2 11 8 13 15 12Z"/><path d="M15 12C20 2 28 0 28 6C28 11 22 13 15 12Z"/><path d="M15 13C9 14 5 20 9 22C13 23 15 17 15 13Z"/><path d="M15 13C21 14 25 20 21 22C17 23 15 17 15 13Z"/></g><path d="M15 8V18" stroke="#8a6a22" stroke-width="1.2"/></symbol>
  </defs>
</svg>

<header id="bar">
  <div class="lgs" data-logo></div>
  <div><button id="rp">↻</button><button id="lang">EN</button><button id="mu" aria-label="Open music player" aria-expanded="false" aria-controls="music-panel"><svg width="16" height="12" viewBox="0 0 16 12" fill="#e6cb80"><rect x="1" y="3" width="2" height="9"/><rect x="7" y="0" width="2" height="12"/><rect x="13" y="5" width="2" height="7"/></svg></button></div>
</header>
<div id="music-panel" class="music-panel" hidden>
  <iframe id="music-frame" title="Wedding music on YouTube" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>

<main id="env">
  <div>
    <h1 class="et foil" data-i="et">សិរីសួស្តីអាពាហ៍ពិពាហ៍</h1>
    <p class="es">The Wedding Invitation</p>
  </div>
  <div class="wrap" id="wrap">
    <div class="back tex"></div>
    <div class="fopen"></div>
    <div class="card tex">
      <svg class="cr"><use href="#crest"/></svg>
      <div class="tt foil">សិរីសួស្តីអាពាហ៍ពិពាហ៍</div>
      <div style="width:56%" data-logo></div>
    </div>
    <div class="pocket tex"><i class="pl"></i><i class="pr"></i><i class="pb"></i></div>
    <div class="fsh" id="fsh"></div>
    <div class="flap" id="flap">
      <svg class="fc" id="ff" viewBox="0 0 100 60" preserveAspectRatio="none"></svg>
      <svg class="fc bk" id="fb" viewBox="0 0 100 60" preserveAspectRatio="none"></svg>
      <div class="lgw" data-logo></div>
    </div>
    <div class="seal" id="seal" role="button" aria-label="Open">
      <svg viewBox="0 0 100 100"><g filter="url(#sl)"><path d="M50 4C62 1 71 8 80 14C90 22 98 34 96 48C99 62 92 74 82 84C72 94 60 99 48 96C34 99 24 92 15 82C5 72 1 60 4 48C2 34 10 22 20 14C30 6 40 7 50 4Z" fill="#b8903a"/><path d="M50 14C60 12 68 17 76 23C84 30 88 40 87 50C89 61 83 70 76 77C68 85 59 88 49 87C38 89 30 84 23 77C15 70 12 60 13 50C12 40 17 31 24 24C31 17 40 15 50 14Z" fill="#d6b45e"/></g><svg x="26" y="30" width="48" height="36" style="color:#7a5a1a"><use href="#crest"/></svg></svg>
    </div>
  </div>
  <p class="hint" data-i="tap">ចុចលើត្រា ដើម្បីបើកធៀប</p>
  <button class="pk" id="pk">Preview with your couple photo</button>
</main>

<div id="scroll">
<section id="cover">
  <div class="ph" id="ph"></div><canvas id="em"></canvas>
  <svg class="cn tl" viewBox="0 0 120 120"><g><use href="#corner"/></g></svg>
  <svg class="cn tr" viewBox="0 0 120 120"><g transform="translate(120 0) scale(-1 1)"><use href="#corner"/></g></svg>
  <svg class="cn bl" viewBox="0 0 120 120"><g transform="translate(0 120) scale(1 -1)"><use href="#corner"/></g></svg>
  <svg class="cn br" viewBox="0 0 120 120"><g transform="translate(120 120) scale(-1 -1)"><use href="#corner"/></g></svg>
  <div class="cv">
    <svg class="cr a"><use href="#crest"/></svg>
    <h2 class="foil a" data-i="et">សិរីសួស្តីអាពាហ៍ពិពាហ៍</h2>
    <p class="sub a">The Wedding Invitation</p>
    <div class="lgb" data-logo></div>
    <div class="en a" id="en"></div>
    <p class="inv a" data-i="inv"></p>
    <p class="guest-greeting a" id="guest-greeting" hidden></p>
    <div class="dt a">
      <div><b class="foil" id="d0"></b><small data-i="d0"></small></div>
      <div><b class="foil" id="d1"></b><small data-i="d1"></small></div>
      <div><b class="foil" id="d2"></b><small data-i="d2"></small></div>
      <div><b class="foil" id="d3"></b><small data-i="d3"></small></div>
    </div>
    <p class="lu a" id="lu"></p>
    <p class="vn a" id="vn"></p>
    <div class="sc a" data-i="sc"></div>
  </div>
</section>
<section id="inv" class="tex"><div class="iv">
  <div class="af"><svg class="aro" viewBox="0 0 100 140" preserveAspectRatio="none"><path d="M1 139V50C1 22 22 1 50 1C78 1 99 22 99 50V139Z" fill="none" stroke="#c9a24a" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
    <div class="ar"><img alt="" src="assets/couple1.png"></div></div>
  <div class="pn">
    <h3 class="ih foil" data-i="ih"></h3>
    <p class="ip" data-i="ip"></p>
    <div class="nr"><div class="nm"><small data-i="gl"></small><b class="foil" data-i="gn"></b></div>
      <svg class="md" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="3" fill="#2f3219" stroke="#c9a24a" stroke-width="1.5"/><rect x="5" y="5" width="54" height="54" fill="none" stroke="#c9a24a" opacity=".5"/><g transform="translate(32 32)" fill="url(#gf)"><path id="pt" d="M0-22C7-14 7-6 0 0C-7-6-7-14 0-22Z"/><use href="#pt" transform="rotate(45)"/><use href="#pt" transform="rotate(90)"/><use href="#pt" transform="rotate(135)"/><use href="#pt" transform="rotate(180)"/><use href="#pt" transform="rotate(225)"/><use href="#pt" transform="rotate(270)"/><use href="#pt" transform="rotate(315)"/><circle r="4" fill="#2f3219"/></g></svg>
      <div class="nm"><small data-i="bl"></small><b class="foil" data-i="bn"></b></div></div>
    <div class="dv"></div>
    <p class="idt" data-i="idt"></p>
  </div>
  
</div></section>
<section id="welcome" class="tex">
  <div class="welcome-card">
    <h3 class="welcome-heading foil" data-i="ih"></h3>
    <svg class="welcome-ornament" viewBox="0 0 320 72" aria-hidden="true">
      <path d="M8 36C48 36 70 58 112 48C132 43 143 37 151 36M312 36C272 36 250 58 208 48C188 43 177 37 169 36"/>
      <path d="M160 4C151 16 151 24 160 31C169 24 169 16 160 4ZM160 68C151 56 151 48 160 41C169 48 169 56 160 68ZM137 36C148 27 154 27 160 36C154 45 148 45 137 36ZM183 36C172 27 166 27 160 36C166 45 172 45 183 36Z"/>
      <circle cx="160" cy="36" r="5"/>
    </svg>
    <p class="welcome-copy" data-i="ip"></p>
  </div>
</section>
<section id="cp" class="tex">
  <h3 class="ch foil" data-i="ch"></h3>
  <svg class="dvd" viewBox="0 0 320 24"><defs><linearGradient id="dl" gradientUnits="userSpaceOnUse" x1="0" x2="320" y1="0" y2="0"><stop offset="0" stop-color="#c9a24a" stop-opacity="0"/><stop offset=".5" stop-color="#f0d98f"/><stop offset="1" stop-color="#c9a24a" stop-opacity="0"/></linearGradient></defs>
    <g class="dl"><path d="M2 12H128M192 12H318" stroke="url(#dl)" stroke-width="1.2"/></g>
    <g class="dc" fill="none" stroke="#e8cf86" stroke-width="1.3" stroke-linecap="round"><path d="M128 12C140 12 144 4 152 6C146 8 146 12 152 13M192 12C180 12 176 4 168 6C174 8 174 12 168 13"/></g>
    <g class="dm"><path d="M160 4L166 12L160 20L154 12Z" fill="url(#gf)"/></g></svg>
  <div class="cg">
    <div class="ph2"><div class="pf"><svg id="sc" viewBox="0 0 100 111"><path fill="none" stroke="url(#gf)" stroke-width=".8"/></svg><div class="im"><img src="assets/couple.jpg" alt=""></div></div></div>
    <div class="gm"><div class="lb" data-i="gl2"></div><div class="nmk foil" data-i="gk"></div><span class="nme" data-i="ge"></span></div>
    <div class="br"><div class="lb" data-i="bl2"></div><div class="nmk foil" data-i="bk"></div><span class="nme" data-i="be"></span></div>
  </div>
</section>
<section id="cd" class="tex">
  <div class="mq" aria-hidden="true"><div class="mt"><span data-i="mq"></span><span data-i="mq"></span></div></div>
  <h3 class="ch foil cdh" data-i="cdh"></h3>
  <div class="cdg">
    <div class="u"><b class="foil" data-u>០០</b><small data-i="u0"></small></div>
    <div class="u"><b class="foil" data-u>០០</b><small data-i="u1"></small></div>
    <div class="u"><b class="foil" data-u>០០</b><small data-i="u2"></small></div>
    <div class="u"><b class="foil" data-u>០០</b><small data-i="u3"></small></div>
  </div>
</section>
<section id="pg" class="tex"><div class="pg">
  <p class="pg-kicker">PROGRAMME</p>
  <h3 class="pgt" data-i="pgh"></h3>
  <svg class="pg-ornament" viewBox="0 0 320 72" aria-hidden="true">
    <path d="M8 36C48 36 70 58 112 48C132 43 143 37 151 36M312 36C272 36 250 58 208 48C188 43 177 37 169 36" />
    <path d="M160 4C151 16 151 24 160 31C169 24 169 16 160 4ZM160 68C151 56 151 48 160 41C169 48 169 56 160 68ZM137 36C148 27 154 27 160 36C154 45 148 45 137 36ZM183 36C172 27 166 27 160 36C166 45 172 45 183 36Z" />
    <circle cx="160" cy="36" r="5" />
  </svg>
  <div class="tl"><div class="bs"></div><div class="tf"></div></div>
</div></section>
<section id="mm"><div class="mpin" id="mpin"><i class="sun" id="sun"></i>
  <div class="mtrack" id="mtrack"><div class="mi">
    <div class="mk foil" data-i="mmk"></div><p class="m1" data-i="mm1"></p><h3 class="mh" data-i="mmh"></h3>
    <div class="ms"><span data-i="mms"></span><i></i></div><button class="pk" id="pk3">Preview with my 10 photos</button>
  </div></div></div></section>
  <!-- In index.html: paste these 3 sections AFTER </section> of #pg and BEFORE <section id="mm"> -->

<section id="qr" class="tex">
  <h3 class="ch foil" data-i="qh"></h3>
  <p class="qs" data-i="qs"></p>
  <div class="qg" id="qg"></div>
</section>

<section id="loc" class="tex">
  <h3 class="ch foil" data-i="lh"></h3>
  <p class="qs" data-i="lv"></p>
  <div class="lph" id="lph"></div>
  <div class="lmap"><iframe id="lm" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
  <a class="map-link" id="map-link" target="_blank" rel="noopener noreferrer" data-i="mapLink"></a>
</section>

<section id="gal" class="tex">
  <h3 class="gallery-heading" data-i="gh"></h3>
  <svg class="gallery-ornament" viewBox="0 0 360 92" aria-hidden="true">
    <path d="M10 60C31 60 39 36 57 29C74 22 88 31 92 43C98 59 81 65 74 55C70 49 75 43 81 45M350 60C329 60 321 36 303 29C286 22 272 31 268 43C262 59 279 65 286 55C290 49 285 43 279 45"/>
    <path d="M10 60C42 58 53 73 83 72C112 71 126 57 148 57C161 57 169 62 180 65C191 62 199 57 212 57C234 57 248 71 277 72C307 73 318 58 350 60"/>
    <path d="M180 10C170 24 171 34 180 42C189 34 190 24 180 10ZM180 82C170 68 171 58 180 50C189 58 190 68 180 82ZM151 46C163 35 173 36 180 46C173 56 163 57 151 46ZM209 46C197 35 187 36 180 46C187 56 197 57 209 46Z"/>
    <path d="M112 55C128 46 139 45 151 48M248 55C232 46 221 45 209 48M180 42V50"/>
    <circle cx="180" cy="46" r="3.5"/>
  </svg>
  <div class="gv"><div class="gt" id="gt"></div></div>
  <div class="gallery-end">
    <svg class="gallery-butterfly" viewBox="0 0 40 36" aria-hidden="true"><path d="M19 17C13 4 2 4 3 12C3 18 11 20 19 18M21 17C27 4 38 4 37 12C37 18 29 20 21 18M19 19C12 18 8 25 12 29C16 32 19 25 19 19M21 19C28 18 32 25 28 29C24 32 21 25 21 19M20 15V27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <button class="gallery-all" id="gallery-all" type="button"></button>
    <svg class="gallery-butterfly" viewBox="0 0 40 36" aria-hidden="true"><path d="M19 17C13 4 2 4 3 12C3 18 11 20 19 18M21 17C27 4 38 4 37 12C37 18 29 20 21 18M19 19C12 18 8 25 12 29C16 32 19 25 19 19M21 19C28 18 32 25 28 29C24 32 21 25 21 19M20 15V27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</section>

<section id="contact" class="tex">
  <div class="contact-inner">
    <p class="contact-copy" data-i="contactIntro"></p>
    <div class="rsvp-card" id="rsvp-card" hidden>
      <h3 class="rsvp-heading foil" data-i="rsvpTitle"></h3>
      <p class="rsvp-intro" data-i="rsvpIntro"></p>
      <p class="rsvp-guest" id="rsvp-guest" hidden><span data-i="rsvpFor"></span> <b id="rsvp-guest-name"></b></p>
      <form class="rsvp-form" id="rsvp-form" hidden>
        <div class="rsvp-field">
          <span id="rsvp-attend-label" data-i="rsvpAttendLabel"></span>
          <div class="rsvp-choice" role="group" aria-labelledby="rsvp-attend-label">
            <button class="rsvp-choice-button selected" id="rsvp-yes" type="button" aria-pressed="true" data-i="rsvpYes"></button>
            <button class="rsvp-choice-button" id="rsvp-no" type="button" aria-pressed="false" data-i="rsvpNo"></button>
          </div>
        </div>
        <div class="rsvp-field" id="rsvp-party-field">
          <span id="rsvp-count-label" data-i="rsvpCountLabel"></span>
          <div class="rsvp-counter" role="group" aria-labelledby="rsvp-count-label">
            <button class="rsvp-count-button" id="rsvp-decrease" type="button" aria-label="Decrease guest count"><span aria-hidden="true">−</span></button>
            <output class="rsvp-count" id="rsvp-count" aria-live="polite" aria-labelledby="rsvp-count-label">1</output>
            <button class="rsvp-count-button" id="rsvp-increase" type="button" aria-label="Increase guest count"><span aria-hidden="true">+</span></button>
          </div>
        </div>
        <details class="rsvp-extra">
          <summary data-i="rsvpMore"></summary>
          <label class="rsvp-field" for="rsvp-phone">
            <span data-i="rsvpPhoneLabel"></span>
            <input id="rsvp-phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
          </label>
          <label class="rsvp-field" for="rsvp-message">
            <span data-i="rsvpMessageLabel"></span>
            <textarea id="rsvp-message" name="message" rows="3" maxlength="500"></textarea>
          </label>
        </details>
        <button class="rsvp-submit" type="submit" data-i="rsvpSubmit"></button>
      </form>
      <p class="rsvp-status" id="rsvp-status" role="status" aria-live="polite"></p>
    </div>
  </div>
</section>

<section id="closing" class="tex">
  <div class="closing-card">
    <h3 class="closing-heading foil" data-i="closingTitle"></h3>
    <svg class="closing-ornament" viewBox="0 0 320 72" aria-hidden="true">
      <path d="M8 36C48 36 70 58 112 48C132 43 143 37 151 36M312 36C272 36 250 58 208 48C188 43 177 37 169 36"/>
      <path d="M160 4C151 16 151 24 160 31C169 24 169 16 160 4ZM160 68C151 56 151 48 160 41C169 48 169 56 160 68ZM137 36C148 27 154 27 160 36C154 45 148 45 137 36ZM183 36C172 27 166 27 160 36C166 45 172 45 183 36Z"/>
      <circle cx="160" cy="36" r="5"/>
    </svg>
    <p class="closing-message" data-i="closingMessage"></p>
    <p class="closing-names foil" id="closing-names"></p>
  </div>
</section>

<!-- Also paste this next to <div id="dark"></div> (outside #scroll) -->
<button class="pk" id="lbtn" data-i="lb"></button>
</div>
